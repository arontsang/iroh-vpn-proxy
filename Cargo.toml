[package]
name = "stun-quic-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/client.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "hello"
path = "src/hello.rs"

[profile.release]
strip = true
codegen-units = 1
lto = true
panic = "abort"


[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "signal"] }
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls"] }
iroh = "1.4.1"
iroh-metrics = "1.0.2"
iroh-tickets = "1.0.0"
iroh-services = "2.0.0"
pin-project = "1.1.13"
async-executor = "1.14.0"
socket2 = "0.6.5"
noq-proto = "1.4.0"
lazy_static = "1.5.1"


