name: Build Azure Function package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-function-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build server and package Azure Function zip
        run: bash ./scripts/build-azure-function.sh

      - name: Upload Azure Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: iroh-vpn-proxy-function-app
          path: dist/iroh-vpn-proxy-function-app.zip