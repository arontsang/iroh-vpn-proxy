name: Build Azure Function package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-function-app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build server and package Azure Function zip
        run: bash ./scripts/build-azure-function.sh

      - name: Upload Azure Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: iroh-vpn-proxy-function-app
          path: dist/iroh-vpn-proxy-function-app.zip
